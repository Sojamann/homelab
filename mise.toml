[tools]
"pipx:ansible-core" = "2.20"
opentofu = "1.12"
talosctl = "1.14"
kubectl = "1.37"
crane = "0.22"
aws-cli = "2.36"
"github:rust-lang/mdBook" = "0.5"
"github:badboy/mdbook-mermaid" = "0.17"
lychee = "0.24"
jq = "1.8"

[env]
KUBECONFIG = "{{ config_root }}/secrets/kubeconfig"
TALOSCONFIG = "{{ config_root }}/secrets/talosconfig"

TODO_DIR = "{{ config_root }}" # for tuxedo

[tasks.save]
description = "Commit the staged changes here plus whatever is dirty in flux/ and secrets/"
run = "./scripts/save.sh"

[tasks.image]
description = "Push a locally built <app>:<version> to zot and bump flux/apps/<app>"
run = "./scripts/image.sh"

[tasks.s3]
description = "aws s3 against Garage as one of its keys: <key> <aws s3 args>"
run = "./scripts/s3.sh"

[tasks.docs]
description = "Serve the docs site, or `build` it to docs/book/ and check its links"
run = "./scripts/docs.sh"

[tasks.machine-config]
description = "Configure the machines"
run = "ansible-playbook machine-config/site.yml"

[tasks.network]
description = "Apply the network layer (args are forwarded to tofu)"
run = "./scripts/tofu.sh network"

[tasks.guests]
description = "Provision the guests (args are forwarded to tofu)"
run = "./scripts/tofu.sh guests"

[tasks.cluster]
description = "Bootstrap and configure the Talos cluster (args are forwarded to tofu)"
run = "./scripts/tofu.sh cluster"

[tasks.platform]
description = "Install the cluster's platform components (args are forwarded to tofu)"
run = "./scripts/tofu.sh platform"
