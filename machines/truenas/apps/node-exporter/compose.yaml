services:
  node-exporter:
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=10.212.4.150:9100'
      - '--collector.textfile.directory=/textfile'
    image: quay.io/prometheus/node-exporter:v1.12.1
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
      - /mnt/slow/node-exporter:/textfile:ro
