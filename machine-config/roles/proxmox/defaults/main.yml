---
# Proxmox VE 9 is Debian 13 (trixie) and uses deb822 .sources files.
pve_release: trixie

# Enterprise repositories to disable. Both 401 without a subscription;
pve_enterprise_sources:
  - pve-enterprise
  - ceph

# Reboots happen automatically on a host's first run only. Set true to allow a
# reboot on an already-initialised host (e.g. to pick up a new kernel).
reboot_ok: false

# Per-host NIC driver workarounds, set in host_vars. Each entry names an
# interface, the reason it needs one, and the ethtool argument lists to apply;
# `{iface}` expands to the interface name.
nic_quirks: []

acme_account: default
acme_directory: https://acme-v02.api.letsencrypt.org/directory
acme_plugin: cloudflare

# Identity the guests layer authenticates as.
pve_api_user: terraform@pve
pve_api_role: TerraformProv
pve_api_token_name: provisioner
# Taken from the bpg/terraform-provider-proxmox docs, minus the identity
# management privileges (Realm.*, User.Modify, Group.Allocate,
# Permissions.Modify) -- that layer manages guests, not proxmox accounts. Add them
# back if that changes.
pve_api_role_privs: >-
  Datastore.Allocate Datastore.AllocateSpace Datastore.AllocateTemplate
  Datastore.Audit Mapping.Audit Mapping.Modify Mapping.Use Pool.Allocate
  Pool.Audit SDN.Allocate SDN.Audit SDN.Use Sys.AccessNetwork Sys.Audit
  Sys.Console Sys.Incoming Sys.Modify Sys.PowerMgmt Sys.Syslog VM.Allocate
  VM.Audit VM.Backup VM.Clone VM.Config.CDROM VM.Config.CPU
  VM.Config.Cloudinit VM.Config.Disk VM.Config.HWType VM.Config.Memory
  VM.Config.Network VM.Config.Options VM.Console VM.GuestAgent.Audit
  VM.GuestAgent.FileRead VM.GuestAgent.FileSystemMgmt VM.GuestAgent.FileWrite
  VM.GuestAgent.Unrestricted VM.Migrate VM.PowerMgmt VM.Replicate VM.Snapshot
  VM.Snapshot.Rollback

# Identity the exporter reads the API as -- PVEAuditor, read-only. Not packaged
# in Debian, so the version is pinned here and installed from PyPI.
pve_exporter_user: pve-exporter@pve
pve_exporter_token_name: monitoring
pve_exporter_version: 3.10.0

# The single datastore every guest lands on. `snippets` is what the terraform
# provider writes cloud-init configuration into; `import` is where it puts disk
# images a guest is built from, and is the one content type Proxmox does not
# enable by default.
pve_datastore: local
pve_datastore_content: images,rootdir,iso,vztmpl,backup,snippets,import
