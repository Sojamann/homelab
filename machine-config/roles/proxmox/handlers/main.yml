---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Restart pveproxy
  ansible.builtin.systemd_service:
    name: pveproxy
    state: restarted

- name: Restart node-exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted

- name: Restart pve-exporter
  ansible.builtin.systemd_service:
    name: pve-exporter
    state: restarted
    daemon_reload: true
