---
# Proxmox requires full-upgrade: a plain upgrade holds back any PVE update that
# needs to install or remove a package, leaving the node half-upgraded.
- name: Upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
    autoremove: true

- name: Check whether a reboot is pending
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - reboot_required.stat.exists
    - first_run or reboot_ok

- name: Report a pending reboot that was not taken
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} needs a reboot (new kernel). It was not rebooted
      because the host is already initialised. Re-run with -e reboot_ok=true.
  when:
    - reboot_required.stat.exists
    - not (first_run or reboot_ok)
