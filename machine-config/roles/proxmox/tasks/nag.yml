---
# Every pve-manager upgrade ships a fresh proxmoxlib.js and reverts this, so it
# has to be reapplied on each run rather than done once by hand.
- name: Neutralise the subscription check in the web UI
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: "res\\.data\\.status\\.toLowerCase\\(\\) !== 'active'"
    replace: "false"
  notify: Restart pveproxy
