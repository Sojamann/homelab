---
# `site.yml` configures the `proxmox` group only; `update.yml` patches every
# group. Machines that do not exist yet stay commented out. Adding one is half
# the job -- network/ carries the address again as an A record (and, for a
# Proxmox host, flux/infrastructure/configs/proxmox scrapes it).
#
# `os_release` pins each host's release -- see roles/upgrade.
all:
  children:
    proxmox:
      hosts:
        titan:     { ansible_host: 10.212.2.151 }
        # enceladus: { ansible_host: 10.212.2.152 }
        # mimas:     { ansible_host: 10.212.2.153 }
        # rhea:      { ansible_host: 10.212.2.154 }
        # iapetus:   { ansible_host: 10.212.2.155 }
        # dione:     { ansible_host: 10.212.2.156 }

    # Installed from the ISO; the guests key is in root's authorized_keys.
    backup:
      vars:
        ansible_ssh_private_key_file: "{{ playbook_dir }}/../secrets/guests-ssh-key"
      hosts:
        pbs: { ansible_host: 10.212.2.162, os_release: trixie }

    # Two subnet routers, one off titan, so the lab stays reachable while
    # titan is down. update.yml never has both down at once.
    routers:
      vars:
        ansible_ssh_private_key_file: "{{ playbook_dir }}/../secrets/guests-ssh-key"
        ansible_become: true
      hosts:
        vpn: { ansible_host: 10.212.2.160, ansible_user: ubuntu, os_release: noble }
        pi:  { ansible_host: 10.212.2.159, ansible_user: pi, os_release: trixie }
