---
# Copy to secrets/vault.yml and encrypt:
#   ansible-vault encrypt secrets/vault.yml
# The password itself goes in secrets/.vault-pass (gitignored).
#
# Leave values unquoted: scripts/lib.sh reads each line raw, so quotes and
# trailing comments become part of the value.

# The DNS zone, without any `lab.` prefix. The only deployment-specific value
# in the repo: the ansible inventory, the network layer and the guests layer
# all derive their names from it.
zone: example.com

acme_email: you@example.com
cloudflare_api_token: cf-token-with-dns-edit-and-zone-read

# Encrypts the network layer's state, which is committed. Minimum 16
# characters. Keep a copy in a password manager: losing it makes every
# committed state unreadable, git history included.
terraform_state_passphrase: at-least-sixteen-characters-please

# The network layer talks to the UniFi controller with this. Create it under
# *Control Plane -> Admins & Users* on a limited admin with local access only;
# it is shown exactly once.
unifi_api_key: unifi-api-key

# Wifi. The names are here as well as the PSKs: an SSID is broadcast in the
# clear, so it is no secret, but wardriving databases index SSIDs against
# coordinates and this repo is public -- see network/unifi_wifi.tf.
wifi_trusted_ssid: TrustedSSID
wifi_iot_ssid: IoTSSID
wifi_trusted_passphrase: change-me
wifi_iot_passphrase: change-me-too

# The network layer writes the tailnet's policy and DNS with this. An OAuth
# client under *Settings -> Trust credentials*, scopes `policy_file` and `dns`
# (write); the secret is shown exactly once.
tailscale_oauth_client_id: tailscale-oauth-client-id
tailscale_oauth_client_secret: tskey-client-secret

# democratic-csi reads and writes zvols on the NAS with this. Created under
# *Credentials -> API Keys*, bound to the dedicated `democratic-csi` user
# rather than to admin, and shown exactly once -- see machines/truenas.md.
truenas_api_key: truenas-api-key

# OpenBao's root token, from `bao operator init` on first install -- see
# platform/README.md. Absent until then, and the only key here that this repo
# produces rather than consumes. The recovery keys from the same command do
# NOT belong here; they go in a password manager.
bao_root_token: bao-root-token

# Alertmanager's two receivers: the Telegram bot that carries the alerts, and
# the heartbeat the permanently-firing `Watchdog` alert pings every 5 minutes,
# so something outside the lab notices when alerting itself dies. Any service
# that complains when a ping stops does -- cronitor, healthchecks, a dead
# man's switch of your own -- the URL is all this repo knows about it.
telegram_bot_token: telegram-bot-token
telegram_chat_id: -1001234567890
heartbeat_url: https://example.com/ping/<some-opaque-id>

# Kassenbuch's login, as the value `scripts/hash-password.js` in its image
# prints (base64 argon2id, without the `KASSENBUCH_PASSWORD_HASH = ` prefix):
#   docker run --rm -it registry.app.<zone>/kassenbuch:<tag> node scripts/hash-password.js
# The plaintext goes in a password manager, not here.
kassenbuch_password_hash: base64-argon2id-hash

# Vaultwarden's /admin token, as the PHC string `vaultwarden hash` prints
# (without the `ADMIN_TOKEN=` prefix and its quotes -- lib.sh reads the line
# raw, so quotes would land in the hash):
#   docker run --rm -it docker.io/vaultwarden/server:<tag> /vaultwarden hash
# The plaintext goes offline -- not into Vaultwarden itself.
vaultwarden_admin_token_hash: $argon2id$v=19$m=65540,t=3,p=4$...

# Grafana's OIDC client, from Pocket ID: Administration -> OIDC Clients. The
# secret is shown once; lost, add a new one under the client's Credentials.
grafana_oidc_client_id: pocket-id-client-id
grafana_oidc_client_secret: pocket-id-client-secret

# OpenBao's OIDC client, same place. Pocket ID clients for Proxmox and PBS are
# entered in their UIs, not here -- see machines/proxmox.md and guests/README.md.
bao_oidc_client_id: pocket-id-client-id
bao_oidc_client_secret: pocket-id-client-secret

# Garage, the S3 service on the NAS -- see machines/truenas.md. The first
# three are pasted into the TrueNAS app at install; the metrics token also
# reaches Prometheus through platform. Generate each with `openssl rand -hex 32`.
garage_rpc_secret: 64-hex-chars
garage_admin_token: 64-hex-chars
garage_metrics_token: 64-hex-chars

# PBS's key on the `proxmox-backups` bucket, from
# `garage key create proxmox-backups`. Entered in the PBS UI;
# kept here so a reinstall needs no new key.
garage_pbs_key_id: GK...
garage_pbs_secret_key: hex-secret-key

# VolSync's key on the `k8s-backups` bucket, from `garage key create volsync`,
# and the restic password for every repository in it (`openssl rand -base64 48`).
# Lose the password and every backup in the bucket is unreadable.
garage_volsync_key_id: GK...
garage_volsync_secret_key: hex-secret-key
volsync_restic_password: base64-48-bytes
